<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bug Squash · Buggy Games YT</title>
<meta name="description" content="Tap the glitchy RGB bugs before they escape. A Buggy Games YT game." />
<meta name="theme-color" content="#0a0814" />
<link rel="icon" href="../games/bugsquash.png" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0814; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: crosshair; }
  #back { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 2; font: bold 14px ui-monospace, Menlo, Consolas, monospace; color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.12); }
  #back.hide { display: none; }
  .ui-btn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 2; font: bold 14px ui-monospace, Menlo, Consolas, monospace; color: #fff; border: 0; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.12); cursor: pointer; }
  .hide { display: none !important; }
  .modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(5,3,12,0.72); padding: 16px; }
  .card { width: min(360px, 100%); max-height: 90vh; overflow: auto; box-sizing: border-box; background: #140f26; border: 2px solid #6b4bff; border-radius: 16px; padding: 20px; color: #fff; font: 15px ui-monospace, Menlo, Consolas, monospace; text-align: center; box-shadow: 0 0 24px rgba(120,90,255,0.45); }
  .card h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 2px; }
  .card p { margin: 6px 0 14px; color: #cfc8ff; }
  .card input { width: 7ch; font: bold 34px ui-monospace, Menlo, Consolas, monospace; text-align: center; text-transform: uppercase; letter-spacing: 6px; background: #0a0814; color: #fff; border: 2px solid #00e5ff; border-radius: 10px; padding: 6px 4px 6px 10px; outline: none; }
  .card .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .card button { font: bold 15px ui-monospace, Menlo, Consolas, monospace; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: #6b4bff; color: #fff; }
  .card button.ghost { background: rgba(255,255,255,0.12); }
  .card button:disabled { opacity: 0.5; cursor: default; }
  .card ol { list-style: none; margin: 10px 0 0; padding: 0; text-align: left; }
  .card li { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 8px; }
  .card li:nth-child(odd) { background: rgba(255,255,255,0.05); }
  .card li.me { background: rgba(0,229,255,0.18); }
  .card li b { color: #ffd23f; width: 2.5ch; display: inline-block; }
  .card .msg { min-height: 1.2em; font-size: 13px; color: #ff6b8b; margin-top: 10px; }
</style>
</head>
<body>
<a id="back" href="../games/index.html">← Games &amp; Apps</a>
<button id="lbBtn" class="ui-btn">🏆 Top 10</button>
<div id="nameModal" class="modal hide">
  <div class="card">
    <h2>NEW TOP SCORE!</h2>
    <p id="nameScore"></p>
    <input id="nameIn" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="AAA" />
    <p style="font-size:12px;margin:8px 0 0">3 letters or numbers</p>
    <div class="row"><button id="nameSkip" class="ghost">Skip</button><button id="nameOk" disabled>Submit</button></div>
    <div class="msg" id="nameMsg"></div>
  </div>
</div>
<div id="lbModal" class="modal hide">
  <div class="card">
    <h2>🏆 TOP 10</h2>
    <p>Bug Squash leaderboard</p>
    <ol id="lbList"><li>Loading…</li></ol>
    <div class="msg" id="lbMsg"></div>
    <div class="row"><button id="lbClose">Close</button></div>
  </div>
</div>
<canvas id="c"></canvas>
<script>
(() => {
  const MENU = 0, PLAYING = 1, PAUSED = 2, OVER = 3;
  const NORMAL = 0, GOLD = 1, VIRUS = 2;
  const cv = document.getElementById('c'), c = cv.getContext('2d');
  const backEl = document.getElementById('back');
  const d = 1; // CSS pixels; canvas is scaled for devicePixelRatio
  let W = 0, H = 0;
  const rnd = Math.random;
  const FONT = 'ui-monospace, Menlo, Consolas, "Courier New", monospace';

  let state = MENU;
  let best = +(localStorage.getItem('bugsquash_best') || 0);
  let score = 0, lives = 3, combo = 0, squashed = 0;
  let comboTimer = 0, spawnTimer = 0, elapsed = 0, overTimer = 0, shake = 0, globalTime = 0, flashRed = 0;
  let newBest = false, last = 0;
  let bugs = [], parts = [], texts = [];
  const pauseBtn = { x: 0, y: 0, w: 0, h: 0 };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const rgba = (r, g, b, a = 255) => `rgba(${r},${g},${b},${(a / 255).toFixed(3)})`;
  function hsv(h, s, v, a = 255) {
    h = ((h % 360) + 360) % 360;
    const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return rgba(Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255), a);
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function startGame() {
    score = 0; lives = 3; combo = 0; squashed = 0;
    comboTimer = 0; spawnTimer = 0.6; elapsed = 0; newBest = false; flashRed = 0;
    bugs = []; parts = []; texts = [];
    state = PLAYING;
  }
  const difficulty = () => Math.min(1 + elapsed / 35 + score / 120, 4.2);

  function spawnBug() {
    const w = W, h = H; if (!w) return;
    const b = { age: 0, entered: false };
    const r = rnd(), diff = difficulty();
    const virusChance = Math.min(0.08 + elapsed / 400, 0.22);
    b.type = r < 0.06 ? GOLD : (r < 0.06 + virusChance ? VIRUS : NORMAL);
    b.size = (b.type === GOLD ? 20 : 26 + rnd() * 8) * d;
    const m = b.size * 2, topPad = 70 * d;
    switch (Math.floor(rnd() * 4)) {
      case 0: b.x = rnd() * w; b.y = topPad - m; break;
      case 1: b.x = w + m; b.y = topPad + rnd() * (h - topPad); break;
      case 2: b.x = rnd() * w; b.y = h + m; break;
      default: b.x = -m; b.y = topPad + rnd() * (h - topPad);
    }
    const tx = w * (0.2 + rnd() * 0.6), ty = topPad + (h - topPad) * (0.2 + rnd() * 0.6);
    const ang = Math.atan2(ty - b.y, tx - b.x);
    let speed = (90 + rnd() * 50) * d * diff;
    if (b.type === GOLD) speed *= 1.45;
    if (b.type === VIRUS) speed *= 0.85;
    b.speed = speed; b.angle = ang; b.baseAngle = ang;
    b.wigglePhase = rnd() * 6.28; b.wiggleAmp = 0.25 + rnd() * 0.45; b.hue = rnd() * 360;
    bugs.push(b);
  }

  function update(dt) {
    globalTime += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 30 * d);
    if (flashRed > 0) flashRed = Math.max(0, flashRed - dt * 2.5);
    parts = parts.filter(q => {
      q.life -= dt; if (q.life <= 0) return false;
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= (1 - 3 * dt); q.vy *= (1 - 3 * dt); return true;
    });
    texts = texts.filter(f => { f.life -= dt; f.y -= 50 * d * dt; return f.life > 0; });

    if (state === OVER) overTimer += dt;
    if (state === MENU) {
      spawnTimer -= dt;
      if (spawnTimer <= 0 && bugs.length < 6) { elapsed = 0; spawnBug(); spawnTimer = 1.2; }
      moveBugs(dt, false);
      return;
    }
    if (state !== PLAYING) return;
    elapsed += dt;
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnBug();
      if (difficulty() > 2.2 && rnd() < 0.3) spawnBug();
      spawnTimer = Math.max(0.28, 1.15 / difficulty()) * (0.7 + rnd() * 0.6);
    }
    moveBugs(dt, true);
  }

  function moveBugs(dt, penalize) {
    const w = W, h = H;
    for (let i = bugs.length - 1; i >= 0; i--) {
      const b = bugs[i];
      b.age += dt;
      b.angle = b.baseAngle + Math.sin(b.age * 4 + b.wigglePhase) * b.wiggleAmp;
      b.x += Math.cos(b.angle) * b.speed * dt;
      b.y += Math.sin(b.angle) * b.speed * dt;
      const m = b.size * 2.5;
      if (b.x > 0 && b.x < w && b.y > 0 && b.y < h) b.entered = true;
      const gone = b.x < -m || b.x > w + m || b.y < -m || b.y > h + m;
      if (gone && (b.entered || b.age > 8)) {
        bugs.splice(i, 1);
        if (penalize && b.type === NORMAL) loseLife(b.x, b.y, 'ESCAPED!');
        if (state !== PLAYING) return;
      }
    }
  }

  function loseLife(x, y, why) {
    lives--; combo = 0; shake = 14 * d; flashRed = 1; buzz(120);
    const fx = Math.max(60 * d, Math.min(W - 60 * d, x));
    const fy = Math.max(110 * d, Math.min(H - 40 * d, y));
    texts.push({ x: fx, y: fy, text: why, color: [255, 60, 80], life: 1.2 });
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = OVER; overTimer = 0;
    if (score > best) { best = score; newBest = true; try { localStorage.setItem('bugsquash_best', best); } catch (e) {} }
    onGameOverLB(score);
  }

  function onDown(x, y) {
    switch (state) {
      case MENU: startGame(); break;
      case PAUSED: state = PLAYING; break;
      case OVER: if (overTimer > 0.9) startGame(); break;
      case PLAYING:
        if (x >= pauseBtn.x && x <= pauseBtn.x + pauseBtn.w && y >= pauseBtn.y && y <= pauseBtn.y + pauseBtn.h) { state = PAUSED; break; }
        tap(x, y);
    }
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); onDown(e.clientX - r.left, e.clientY - r.top); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (modalOpen()) { if (e.key === 'Escape') { closeBoard(); nameModal.classList.add('hide'); } return; }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (state === PLAYING) state = PAUSED;
      else if (e.key === 'Escape' && (state === PAUSED || state === OVER)) { state = MENU; bugs = []; }
      else if (state === PAUSED) state = PLAYING;
    } else if (e.key === ' ' || e.key === 'Enter') {
      if (state === MENU || (state === OVER && overTimer > 0.9)) startGame();
      else if (state === PAUSED) state = PLAYING;
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === PLAYING) state = PAUSED; last = 0; });

  function tap(x, y) {
    let hit = -1, bestDist = Infinity;
    bugs.forEach((b, i) => {
      const dist = Math.hypot(b.x - x, b.y - y);
      const reach = Math.max(b.size * 1.25, 34 * d);
      if (dist < reach && dist < bestDist) { bestDist = dist; hit = i; }
    });
    if (hit < 0) { combo = 0; for (let i = 0; i < 5; i++) addParticle(x, y, [255, 255, 255, 160], 60, 0.3); return; }
    const b = bugs.splice(hit, 1)[0];
    if (b.type === VIRUS) { splat(b.x, b.y, [255, 40, 70], 26); loseLife(b.x, b.y, 'VIRUS!'); return; }
    buzz(15);
    combo++; comboTimer = 1.3; squashed++;
    const mult = Math.min(1 + Math.floor(combo / 5), 5);
    const pts = (b.type === GOLD ? 5 : 1) * mult;
    score += pts;
    const col = b.type === GOLD ? [255, 210, 40] : b.hue;
    splat(b.x, b.y, col, b.type === GOLD ? 30 : 18);
    let label = '+' + pts + (mult > 1 ? '  x' + mult : '');
    if (b.type === GOLD) label = 'GOLDEN! ' + label;
    texts.push({ x: b.x, y: b.y, text: label, color: b.type === GOLD ? [255, 220, 60] : [255, 255, 255], life: 0.9 });
    if (b.type === GOLD && lives < 3 && rnd() < 0.35) {
      lives++;
      texts.push({ x: b.x, y: b.y - 30 * d, text: '+1 LIFE', color: [80, 255, 140], life: 1.1 });
    }
  }

  function splat(x, y, color, n) {
    for (let i = 0; i < n; i++) addParticle(x, y, color, 260, 0.55 + rnd() * 0.4);
    for (let i = 0; i < Math.floor(n / 3); i++) addParticle(x, y, [255, 255, 255], 180, 0.3);
  }
  function addParticle(x, y, color, spd, life) {
    const a = rnd() * 6.283, s = (0.3 + rnd()) * spd * d;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life, maxLife: life, size: (2 + rnd() * 4) * d });
  }
  function colorStr(col, alphaMul) {
    if (typeof col === 'number') return hsv(col, 1, 1, 255 * alphaMul);
    const a = (col[3] === undefined ? 255 : col[3]) * alphaMul;
    return rgba(col[0], col[1], col[2], a);
  }

  function frame(now) {
    let dt = last ? (now - last) / 1000 : 0;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    backEl.classList.toggle('hide', state === PLAYING);
    lbBtn.classList.toggle('hide', state === PLAYING || state === PAUSED);

    const w = W, h = H;
    c.save();
    if (shake > 0) c.translate((rnd() - 0.5) * shake, (rnd() - 0.5) * shake);
    drawBackground(w, h);
    bugs.forEach(drawBug);
    parts.forEach(q => {
      c.fillStyle = colorStr(q.color, Math.max(0, q.life / q.maxLife));
      c.beginPath(); c.arc(q.x, q.y, q.size, 0, Math.PI * 2); c.fill();
    });
    c.textAlign = 'center';
    c.font = `bold ${20 * d}px ${FONT}`;
    texts.forEach(f => { c.fillStyle = rgba(f.color[0], f.color[1], f.color[2], 255 * Math.min(1, f.life * 2)); c.fillText(f.text, f.x, f.y); });
    c.restore();

    if (flashRed > 0) { c.fillStyle = rgba(255, 0, 40, 90 * flashRed); c.fillRect(0, 0, w, h); }
    if (state === PLAYING || state === PAUSED) drawHud(w);
    if (state === MENU) drawMenu(w, h);
    if (state === PAUSED) drawPaused(w, h);
    if (state === OVER) drawOver(w, h);
    requestAnimationFrame(frame);
  }

  function line(x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }

  function drawBackground(w, h) {
    c.fillStyle = rgba(10, 8, 20); c.fillRect(-20, -20, w + 40, h + 40);
    const g = 40 * d, off = (globalTime * 12 * d) % g;
    c.lineWidth = 1 * d; c.strokeStyle = rgba(120, 90, 255, 28);
    c.beginPath();
    for (let x = -off; x < w; x += g) { c.moveTo(x, 0); c.lineTo(x, h); }
    for (let y = -off; y < h; y += g) { c.moveTo(0, y); c.lineTo(w, y); }
    c.stroke();
    c.fillStyle = rgba(0, 0, 0, 18);
    for (let y = 0; y < h; y += 4 * d) c.fillRect(0, y - d, w, 2 * d);
  }

  function drawBug(b) {
    let glitch = 2.5 * d;
    if (rnd() < 0.04) glitch = 7 * d;
    let main;
    if (b.type === GOLD) main = rgba(255, 205, 40);
    else if (b.type === VIRUS) main = rgba(255, 30, 60);
    else main = hsv(b.hue + globalTime * 90, 0.9, 1);
    drawBugShape(b, b.x - glitch, b.y, rgba(255, 0, 60, 120), false);
    drawBugShape(b, b.x + glitch, b.y, rgba(0, 230, 255, 120), false);
    drawBugShape(b, b.x, b.y, main, true);
  }

  function ellipse(x1, y1, x2, y2) { c.beginPath(); c.ellipse((x1 + x2) / 2, (y1 + y2) / 2, (x2 - x1) / 2, (y2 - y1) / 2, 0, 0, Math.PI * 2); c.fill(); }
  function circle(x, y, r, stroke) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); stroke ? c.stroke() : c.fill(); }

  function drawBugShape(b, x, y, color, details) {
    const s = b.size;
    c.save(); c.translate(x, y); c.rotate(b.angle);
    c.fillStyle = color; c.strokeStyle = color; c.lineCap = 'round';
    if (b.type === VIRUS) {
      c.lineWidth = 3 * d;
      const spin = b.age * 2;
      for (let i = 0; i < 10; i++) {
        const a = spin + i * Math.PI / 5, cx = Math.cos(a), sy = Math.sin(a);
        line(cx * s * 0.55, sy * s * 0.55, cx * s * 0.95, sy * s * 0.95);
        circle(cx * s, sy * s, 2.5 * d, true);
      }
      circle(0, 0, s * 0.6);
      if (details) {
        c.strokeStyle = rgba(20, 0, 10); c.lineWidth = 3 * d;
        const e = s * 0.18;
        line(-e * 2, -e * 1.6, -e * 0.4, 0); line(-e * 0.4, -e * 1.6, -e * 2, 0);
        line(e * 0.4, -e * 1.6, e * 2, 0); line(e * 2, -e * 1.6, e * 0.4, 0);
      }
      c.restore(); return;
    }
    c.lineWidth = 2.5 * d;
    const swing = Math.sin(b.age * 22) * s * 0.18;
    for (let i = -1; i <= 1; i++) {
      const lx = i * s * 0.32, sw = i === 0 ? -swing : swing;
      line(lx, 0, lx + sw + s * 0.1, -s * 0.75);
      line(lx, 0, lx - sw + s * 0.1, s * 0.75);
    }
    line(s * 0.7, -s * 0.1, s * 1.05, -s * 0.4);
    line(s * 0.7, s * 0.1, s * 1.05, s * 0.4);
    ellipse(-s * 0.6, -s * 0.42, s * 0.45, s * 0.42);
    circle(s * 0.6, 0, s * 0.26);
    if (details) {
      c.strokeStyle = rgba(0, 0, 0, 110); c.lineWidth = 2 * d;
      line(-s * 0.55, 0, s * 0.4, 0);
      c.fillStyle = rgba(255, 255, 255, 90);
      const blk = (Math.floor(b.age * 8) % 3) * s * 0.12;
      c.fillRect(-s * 0.35 + blk, -s * 0.3, s * 0.2, s * 0.14);
      c.fillStyle = '#fff'; circle(s * 0.68, -s * 0.12, s * 0.08); circle(s * 0.68, s * 0.12, s * 0.08);
      c.fillStyle = '#000'; circle(s * 0.71, -s * 0.12, s * 0.04); circle(s * 0.71, s * 0.12, s * 0.04);
      if (b.type === GOLD) {
        c.fillStyle = rgba(255, 255, 255, 150 + 100 * Math.sin(b.age * 12));
        circle(-s * 0.1, -s * 0.55, 2.5 * d); circle(s * 0.2, s * 0.6, 2 * d);
      }
    }
    c.restore();
  }

  function setFont(size) { c.font = `bold ${size}px ${FONT}`; }
  function glitchText(t, x, y, size) {
    setFont(size);
    const j = (rnd() < 0.08 ? 6 : 2.5) * d;
    c.fillStyle = rgba(255, 0, 70, 200); c.fillText(t, x - j, y);
    c.fillStyle = rgba(0, 230, 255, 200); c.fillText(t, x + j, y);
    c.fillStyle = '#fff'; c.fillText(t, x, y);
  }

  function drawHeart(x, y, r, color) {
    c.fillStyle = color;
    circle(x - r * 0.5, y, r * 0.55); circle(x + r * 0.5, y, r * 0.55);
    c.beginPath(); c.moveTo(x - r * 1.02, y + r * 0.15); c.lineTo(x + r * 1.02, y + r * 0.15); c.lineTo(x, y + r * 1.15); c.closePath(); c.fill();
  }

  function drawHud(w) {
    const top = 46 * d;
    c.textAlign = 'left';
    setFont(26 * d); c.fillStyle = '#fff'; c.fillText(String(score), 18 * d, top);
    setFont(13 * d); c.fillStyle = rgba(255, 255, 255, 170); c.fillText('BEST ' + best, 18 * d, top + 20 * d);
    for (let i = 0; i < 3; i++) drawHeart(w / 2 - 30 * d + i * 30 * d, top - 9 * d, 10 * d, i < lives ? rgba(255, 50, 90) : rgba(255, 255, 255, 60));
    if (combo >= 5) {
      c.textAlign = 'center'; setFont(14 * d);
      c.fillStyle = hsv(globalTime * 300, 0.8, 1);
      c.fillText('COMBO ' + combo + '  x' + Math.min(1 + Math.floor(combo / 5), 5), w / 2, top + 22 * d);
    }
    const bs = 40 * d;
    pauseBtn.x = w - bs - 14 * d; pauseBtn.y = top - 30 * d; pauseBtn.w = bs; pauseBtn.h = bs;
    c.fillStyle = rgba(255, 255, 255, 50);
    c.beginPath(); c.roundRect ? c.roundRect(pauseBtn.x, pauseBtn.y, bs, bs, 10 * d) : c.rect(pauseBtn.x, pauseBtn.y, bs, bs); c.fill();
    c.fillStyle = '#fff';
    const cx = pauseBtn.x + bs / 2, cy = pauseBtn.y + bs / 2;
    c.fillRect(cx - 8 * d, cy - 9 * d, 5 * d, 18 * d); c.fillRect(cx + 3 * d, cy - 9 * d, 5 * d, 18 * d);
    c.textAlign = 'center';
  }

  function dim(w, h, a) { c.fillStyle = rgba(5, 3, 12, a); c.fillRect(0, 0, w, h); }

  function drawMenu(w, h) {
    dim(w, h, 120); c.textAlign = 'center';
    const fit = Math.min(54 * d, w / 6.5);
    glitchText('BUG', w / 2, h * 0.30, fit * 1.2);
    glitchText('SQUASH', w / 2, h * 0.30 + fit * 1.15, fit);
    const small = Math.min(14 * d, w / 30);
    setFont(small);
    const y = h * 0.52;
    c.fillStyle = rgba(255, 255, 255, 220); c.fillText('Tap the glitchy bugs before they escape', w / 2, y);
    c.fillStyle = rgba(255, 210, 40); c.fillText('Golden bugs = 5 points', w / 2, y + 26 * d);
    c.fillStyle = rgba(255, 60, 90); c.fillText('Never tap the red viruses!', w / 2, y + 52 * d);
    if (best > 0) { c.fillStyle = rgba(180, 160, 255, 200); setFont(16 * d); c.fillText('BEST  ' + best, w / 2, y + 96 * d); }
    const pulse = 0.6 + 0.4 * Math.sin(globalTime * 4);
    setFont(22 * d); c.fillStyle = rgba(255, 255, 255, 255 * pulse);
    c.fillText(matchMedia('(pointer: coarse)').matches ? 'TAP TO START' : 'CLICK TO START', w / 2, h * 0.80);
    setFont(12 * d); c.fillStyle = rgba(255, 255, 255, 140); c.fillText('by Buggy Games YT', w / 2, h - 28 * d);
  }

  function drawPaused(w, h) {
    dim(w, h, 170); c.textAlign = 'center';
    glitchText('PAUSED', w / 2, h * 0.45, Math.min(46 * d, w / 6));
    setFont(16 * d); c.fillStyle = rgba(255, 255, 255, 210);
    c.fillText('Tap to resume', w / 2, h * 0.45 + 44 * d);
  }

  function drawOver(w, h) {
    dim(w, h, 175); c.textAlign = 'center';
    glitchText('GAME OVER', w / 2, h * 0.32, Math.min(44 * d, w / 7));
    setFont(60 * d); c.fillStyle = '#fff'; c.fillText(String(score), w / 2, h * 0.47);
    setFont(16 * d); c.fillStyle = rgba(255, 255, 255, 200); c.fillText(squashed + ' bugs squashed', w / 2, h * 0.47 + 32 * d);
    if (newBest) { setFont(20 * d); c.fillStyle = hsv(globalTime * 300, 0.8, 1); c.fillText('NEW HIGH SCORE!', w / 2, h * 0.47 + 66 * d); }
    else { c.fillStyle = rgba(180, 160, 255, 200); c.fillText('BEST  ' + best, w / 2, h * 0.47 + 62 * d); }
    if (overTimer > 0.9) {
      const pulse = 0.6 + 0.4 * Math.sin(globalTime * 4);
      setFont(20 * d); c.fillStyle = rgba(255, 255, 255, 255 * pulse);
      c.fillText('TAP TO PLAY AGAIN', w / 2, h * 0.75);
    }
  }


  // ---------------- leaderboard ----------------
  const LB_DB = 'https://bugsquash-leaderboard-default-rtdb.firebaseio.com/bugsquash/scores.json';
  const nameModal = document.getElementById('nameModal'), nameIn = document.getElementById('nameIn');
  const nameOk = document.getElementById('nameOk'), nameMsg = document.getElementById('nameMsg');
  const lbModal = document.getElementById('lbModal'), lbList = document.getElementById('lbList'), lbMsg = document.getElementById('lbMsg');
  const lbBtn = document.getElementById('lbBtn');
  let board = [], myName = localStorage.getItem('bugsquash_name') || '', lastMine = null, pendingScore = 0, lbPoll = 0;
  const modalOpen = () => !nameModal.classList.contains('hide') || !lbModal.classList.contains('hide');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const toBoard = obj => {
    const best = {};
    Object.values(obj || {}).forEach(e => {
      if (e && /^[A-Z0-9]{3}$/.test(e.n) && e.s > 0 && e.s <= 100000 && (!best[e.n] || e.s > best[e.n])) best[e.n] = e.s;
    });
    return Object.keys(best).map(n => ({ n, s: best[n] })).sort((a, c) => c.s - a.s).slice(0, 10);
  };
  async function lbGet() {
    for (let i = 0; i < 3; i++) {
      try {
        const r = await fetch(LB_DB + '?orderBy=%22s%22&limitToLast=200', { cache: 'no-store' });
        if (r.ok) { board = toBoard(await r.json()); try { localStorage.setItem('bugsquash_board', JSON.stringify(board)); } catch (e) {} return true; }
      } catch (e) {}
      await sleep(600 + i * 500);
    }
    return false;
  }
  try { board = JSON.parse(localStorage.getItem('bugsquash_board') || '[]'); } catch (e) { board = []; }
  async function lbSubmit(name, sc) {
    for (let i = 0; i < 4; i++) {
      try {
        const r = await fetch(LB_DB, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n: name, s: sc, t: Date.now() }) });
        if (r.ok) { await lbGet(); return true; }
      } catch (e) {}
      await sleep(700 + i * 600);
    }
    return false;
  }
  const qualifies = sc => sc > 0 && (board.length < 10 || sc > board[board.length - 1].s);
  function renderBoard() {
    if (!board.length) { lbList.innerHTML = '<li>No scores yet. Be the first!</li>'; return; }
    lbList.innerHTML = board.map((e, i) =>
      `<li class="${e.n === lastMine ? 'me' : ''}"><span><b>${i + 1}</b> ${e.n}</span><span>${e.s}</span></li>`).join('');
  }
  async function openBoard() {
    lbModal.classList.remove('hide'); lbMsg.textContent = '';
    renderBoard();
    const ok = await lbGet();
    if (!ok) lbMsg.textContent = "Couldn't reach the leaderboard. Try again in a sec.";
    renderBoard();
    clearInterval(lbPoll);
    lbPoll = setInterval(async () => { if (lbModal.classList.contains('hide')) return clearInterval(lbPoll); if (await lbGet()) renderBoard(); }, 15000);
  }
  function closeBoard() { lbModal.classList.add('hide'); clearInterval(lbPoll); }
  lbBtn.addEventListener('click', openBoard);
  document.getElementById('lbClose').addEventListener('click', closeBoard);
  lbModal.addEventListener('pointerdown', e => { if (e.target === lbModal) closeBoard(); });
  nameIn.addEventListener('input', () => {
    nameIn.value = nameIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
    nameOk.disabled = nameIn.value.length !== 3;
  });
  nameIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !nameOk.disabled) nameOk.click(); });
  document.getElementById('nameSkip').addEventListener('click', () => { nameModal.classList.add('hide'); });
  nameOk.addEventListener('click', async () => {
    const name = nameIn.value;
    nameOk.disabled = true; nameMsg.style.color = '#cfc8ff'; nameMsg.textContent = 'Saving…';
    myName = name; try { localStorage.setItem('bugsquash_name', name); } catch (e) {}
    const ok = await lbSubmit(name, pendingScore);
    if (ok) { lastMine = name; nameModal.classList.add('hide'); openBoard(); }
    else { nameMsg.style.color = '#ff6b8b'; nameMsg.textContent = "Couldn't save. Tap Submit to try again."; nameOk.disabled = false; }
  });
  async function onGameOverLB(sc) {
    if (sc <= 0) return;
    await lbGet();
    if (state !== OVER || !qualifies(sc)) return;
    pendingScore = sc;
    document.getElementById('nameScore').textContent = 'You scored ' + sc + '. Put your name on the board:';
    nameIn.value = myName; nameOk.disabled = myName.length !== 3; nameMsg.textContent = '';
    nameModal.classList.remove('hide');
    setTimeout(() => nameIn.focus(), 50);
  }
  lbGet();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
