name: Update channel stats and latest upload

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite the latest upload copy even if the video hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stats.py
      - run: python scripts/update_latest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update channel stats"
            git push
          fi
