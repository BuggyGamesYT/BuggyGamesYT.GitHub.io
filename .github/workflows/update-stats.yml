name: Update channel stats and latest upload

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite the latest upload copy even if the video hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stats.py
      - name: Read newest video title
        id: feed
        run: |
          T=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCbQEjz-XWsJdWfzIdTqOc5Q" | python3 -c "import sys,re,html;m=re.findall(r'<title>([^<]+)</title>',sys.stdin.read());print(html.unescape(m[1]) if len(m)>1 else '')")
          echo "title=$T" >> "$GITHUB_OUTPUT"
      - name: Write headline and joke with AI
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt: |
            You write copy for Buggy, a YouTuber who posts short clips of video game bugs and glitches.
            His newest video is titled: "${{ steps.feed.outputs.title }}".
            Write two things in his playful, deadpan gamer voice:
            1. headline: starts with "Fresh out of the void: " then a short witty summary of the video, max 60 characters total, ending with a period.
            2. joke: one short funny line about the bug, max 60 characters, like "The floor had one job."
            Family friendly, no hashtags, no emojis. Reply with JSON only: {"headline": "...", "joke": "..."}
      - run: python scripts/update_latest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet index.html || [ -f ai-debug.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A index.html ai-debug.log 2>/dev/null || git add index.html
            git commit -m "Update channel stats"
            git push
          fi
